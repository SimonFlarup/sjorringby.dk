<section id="headerwrap" class="hero">
  <div class="container text-center">
    <div class="markdown-content" [innerHTML]="heroHtml()"></div>
    <img src="assets/img/so.jpg" alt="Udsigt over Sjørring" />
  </div>
</section>

<section id="service" class="section">
  <div class="container cards">
    <article class="panel">
      <div aria-hidden="true">🍃</div>
      <div class="markdown-content" [innerHTML]="omkringHtml()"></div>
      <a routerLink="/omkring" class="button">Læs mere</a>
    </article>

    <article class="panel">
      <div aria-hidden="true">🏠</div>
      <div class="markdown-content" [innerHTML]="husHtml()"></div>
      <div class="actions">
        <a routerLink="/huset" class="button">Læs mere</a>
        <a class="button ghost" href="http://fb.sjorringby.dk" target="_blank" rel="noopener">Følg på Facebook</a>
      </div>
    </article>

    <article class="panel">
      <div aria-hidden="true">👩</div>
      <div class="markdown-content" [innerHTML]="kisHtml()"></div>
      <a routerLink="/kis" class="button">Læs mere</a>
    </article>
  </div>
</section>
