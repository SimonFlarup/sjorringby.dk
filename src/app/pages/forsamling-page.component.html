<section id="blue" class="hero dark">
  <div class="container">
    <h1>Forsamlingshuset</h1>
  </div>
</section>

<div id="husetwrap"></div>

<section class="section">
  <div class="container columns columns-wide-aside">
    <article class="panel">
      <div class="markdown-content" [innerHTML]="articleHtml"></div>
    </article>

    <aside class="panel facebook-card" #facebookHost>
      <h3>Følg os på Facebook</h3>
      <hr />
      <div class="facebook-embed">
        <iframe
          class="facebook-frame"
          [src]="facebookSrc"
          [attr.width]="facebookWidth"
          [attr.height]="facebookHeight"
          (load)="onFacebookLoad()"
          scrolling="yes"
          frameborder="0"
          allowtransparency="true"
          allow="encrypted-media"
          loading="lazy"
          title="Sjørring Facebook side"
        ></iframe>
      </div>
    </aside>
  </div>
</section>
